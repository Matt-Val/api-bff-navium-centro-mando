spring.application.name=bff-centro-mando
server.port=8084

springdoc.swagger-ui.path=/swagger-ui.html

spring.main.allow-bean-definition-overriding=true

# Origen permitido para CORS (separar por coma si hay varios)
# Origen permitido para CORS (Web en S3)
navium.web.allowed-origins=${WEB_URL:http://localhost:5173,http://127.0.0.1:5173,http://navium-centro-mando-app.s3-website-us-east-1.amazonaws.com,http://navium-login-central.s3-website-us-east-1.amazonaws.com,http://navium-sucursal-virtual.s3-website-us-east-1.amazonaws.com}

# Clave Temporal para JWT
jwt.secret=${JWT_SECRET:NaviumSuperSecretKeyParaFirmaDeTokens2026!}

# URLS de los Microservicios en EC2
navium.api.contenedores.url=${API_CONTENEDORES_URL:http://54.225.232.55:8080}
navium.api.agendamientos.url=${API_AGENDAMIENTOS_URL:http://localhost:8082}
navium.api.andenes.url=${API_ANDENES_URL:http://3.231.240.72:8083}
navium.api.usuarios.url=${API_USUARIOS_URL:http://54.225.232.55:8081}

# --- RESILIENCE4J CONFIGURATION ---

# Configuración de Timeouts (Ej: Si Agendamiento tarda más de 5 segundos, se corta)
resilience4j.timelimiter.instances.servicioAgendamiento.timeout-duration=5s
resilience4j.timelimiter.instances.servicioAndenes.timeout-duration=5s
resilience4j.timelimiter.instances.servicioContenedores.timeout-duration=5s
resilience4j.timelimiter.instances.servicioUsuarios.timeout-duration=5s

# Configuración del Circuit Breaker
# (Si falla el 50% de las peticiones, abre el circuito. Espera 10 seg en estado semi-abierto)
resilience4j.circuitbreaker.instances.servicioAgendamiento.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.servicioAgendamiento.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.servicioAgendamiento.sliding-window-size=10
resilience4j.circuitbreaker.instances.servicioUsuarios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.servicioUsuarios.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.servicioUsuarios.sliding-window-size=10
