name: Despliegue a EC2 - BFF Centro Mando

on:
  push:
    branches:
      - deploy 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-bff:latest

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          WEB_URL: ${{ secrets.WEB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_CONTENEDORES_URL: ${{ secrets.API_CONTENEDORES_URL }}
          API_AGENDAMIENTOS_URL: ${{ secrets.API_AGENDAMIENTOS_URL }}
          API_ANDENES_URL: ${{ secrets.API_ANDENES_URL }}
          API_USUARIOS_URL: ${{ secrets.API_USUARIOS_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,WEB_URL,JWT_SECRET,API_CONTENEDORES_URL,API_AGENDAMIENTOS_URL,API_ANDENES_URL,API_USUARIOS_URL
          script: |
            if [ ! -d "api-bff-navium-centro-mando" ]; then
              git clone https://github.com/matt-val/api-bff-navium-centro-mando.git
            fi
            
            cd api-bff-navium-centro-mando
            
            git checkout deploy
            git pull origin deploy
            
            echo "DOCKER_USERNAME=$DOCKER_USERNAME" > .env
            echo "WEB_URL=$WEB_URL" >> .env
            echo "JWT_SECRET=$JWT_SECRET" >> .env
            echo "API_CONTENEDORES_URL=$API_CONTENEDORES_URL" >> .env
            echo "API_AGENDAMIENTOS_URL=$API_AGENDAMIENTOS_URL" >> .env
            echo "API_ANDENES_URL=$API_ANDENES_URL" >> .env
            echo "API_USUARIOS_URL=$API_USUARIOS_URL" >> .env
            
            sudo docker compose down
            sudo docker compose pull
            sudo docker compose up -d